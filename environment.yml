name: pybend-apex
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - numpy=2.1.2
  - pandas=2.2.3
  - scipy=1.14.1
  - shapely=2.0.6
  - networkx=3.4.2
  - matplotlib=3.9.2
  - psutil=6.1.0
  - seaborn=0.13.2
  - statsmodels=0.14.4
  - typing_extensions=4.12
  - jupyterlab
  - ipykernel
  - pip:
      # Install pyBenD from the local repo checkout (recommended for notebooks reproducibility)
      - -e .
      # PyPI name used by the project for DTW
      - dtw-python==1.5.3
